baseURL: https://typewatch.github.io/
locale: en-us
title: typewatch
theme: hextra

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

markup:
  goldmark:
    renderer:
      unsafe: true

disableKinds: ["rss"]

security:
  http:
    methods:
      - GET
      - POST
    urls:
      - ^https?://[a-z]
      - ^https://cdn.jsdelivr.net
      - '!localhost'
      - '!@'

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    label: English
    weight: 1
    title: typewatch
    menu:
      main:
        - name: docs
          pageRef: /docs
          weight: 1
        - name: blog
          pageRef: /blog
          weight: 2
        - name: projects
          pageRef: /projects
          weight: 3
        - name: about
          pageRef: /about
          weight: 4
        - name: GitHub
          weight: 5
          url: "https://github.com/typewatch/typewatch.github.io/"
          params:
            icon: github
  es:
    label: Español
    weight: 2
    title: typewatch
    menu:
      main:
        - name: docs
          pageRef: /docs
          weight: 1
        - name: blog
          pageRef: /blog
          weight: 2
        - name: proyectos
          pageRef: /projects
          weight: 3
        - name: sobre mí
          pageRef: /about
          weight: 4
        - name: GitHub
          weight: 5
          url: "https://github.com/typewatch/typewatch.github.io/"
          params:
            icon: github
