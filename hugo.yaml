baseURL: https://typewatch.dev/
locale: en-us
title: typewatch
theme: hextra

params:
  description: "The projects, documentation, and blog of typewatch."

  search:
    enable: false

  navbar:
    displayLogo: false

  footer:
    displayPoweredBy: false

markup:
  goldmark:
    renderer:
      unsafe: true

disableKinds: ["rss"]

enableRobotsTXT: true

taxonomies:
  tag: tags

languages:
  en:
    label: English
    weight: 1
    title: typewatch
    menu:
      main:
        - name: docs
          pageRef: /docs
          weight: 1
        - name: blog
          pageRef: /blog
          weight: 2
        - name: projects
          pageRef: /projects
          weight: 3
        - name: about
          pageRef: /about
          weight: 4
        - name: GitHub
          weight: 5
          url: "https://github.com/typewatch/typewatch.github.io/"
          params:
            icon: github
  es:
    label: Español
    weight: 2
    title: typewatch
    menu:
      main:
        - name: docs
          pageRef: /docs
          weight: 1
        - name: blog
          pageRef: /blog
          weight: 2
        - name: proyectos
          pageRef: /projects
          weight: 3
        - name: sobre mí
          pageRef: /about
          weight: 4
        - name: GitHub
          weight: 5
          url: "https://github.com/typewatch/typewatch.github.io/"
          params:
            icon: github
